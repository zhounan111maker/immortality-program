<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>永生计划 · 研究纲领平台</title>
    <meta
      name="description"
      content="一个以「迁移永生协议」为核心的可检验研究纲领发布平台：协议、实验与文献，全部公开、可复现、可证伪。"
    />
    <meta name="author" content="永生计划研究纲领" />
    <meta name="robots" content="index,follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0E5F4F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#132019" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / 分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="永生计划 · 研究纲领平台" />
    <meta property="og:title" content="永生计划 · 研究纲领平台" />
    <meta
      property="og:description"
      content="一个可检验、可复现、可证伪的迁移永生研究纲领发布平台。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="永生计划 · 研究纲领平台" />
    <meta
      name="twitter:description"
      content="一个可检验、可复现、可证伪的迁移永生研究纲领发布平台。"
    />

    <!--
      字体策略：不阻塞首屏。
      这里只做 preconnect，真正的字体 CSS 由 src/core/fonts.ts 在空闲时段注入。
      若字体服务不可达（离线、被墙），页面立即回退到系统中文字体栈，内容始终可读。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /*
        首屏内联关键样式：避免样式表加载前的白屏与布局跳动。
        这些值必须与 src/styles/design-system.css 中的 tokens 保持一致。
      */
      :root {
        color-scheme: light;
        --paper: #f4f1e8;
        --dark: #132019;
        --brand: #0e5f4f;
      }
      html {
        background: #f4f1e8;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: #1c2b25;
        font-family:
          'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC',
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* 应用挂载前的骨架屏，避免出现空白闪烁 */
      #app:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #132019 0%, #1b2e25 42%, #f4f1e8 42%, #f4f1e8 100%);
      }
      .boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9000;
        background: #f4f1e8;
        font-size: 0.95rem;
        color: #6e7b74;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
        }
        html,
        body {
          background: #101a15;
        }
        #app:empty::after {
          background: #101a15;
        }
        .boot-fallback {
          background: #101a15;
          color: #93a49a;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-to-main" href="#main">跳到主要内容</a>

    <div id="app">
      <div id="boot-fallback" class="boot-fallback">正在载入研究纲领平台…</div>
    </div>

    <noscript>
      <div
        style="
          max-width: 720px;
          margin: 80px auto;
          padding: 32px;
          font-family: system-ui, sans-serif;
          line-height: 1.8;
          color: #1c2b25;
        "
      >
        <h1 style="font-size: 1.5rem">需要启用 JavaScript</h1>
        <p>
          本站是一个客户端渲染的研究纲领发布平台，需要 JavaScript 才能显示协议、实验与文献内容。
          请在浏览器设置中启用 JavaScript 后刷新页面。
        </p>
        <p style="color: #6e7b74; font-size: 0.9rem">
          本站不收集任何个人可识别信息，不设置追踪性 Cookie，不加载第三方广告或统计脚本。
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
